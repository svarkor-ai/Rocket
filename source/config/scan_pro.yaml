# Stock Scan Pro Configuration
# Edit this file with your Telegram bot token and scan preferences.
# NEVER commit secrets — use scan_pro.env for actual values.

# Telegram Bot Settings
telegram:
  bot_token: "${SCAN_PRO_TELEGRAM_BOT_TOKEN}"  # set via environment variable
  admin_chat_id: 0  # your Telegram chat ID (set after /start)

# Scan Settings
scanning:
  # How often to scan each region (in minutes)
  interval_minutes:
    usa: 15
    sweden: 30
    china: 30
    india: 30

  # Ticker limits per region (0 = all)
  ticker_limit:
    usa: 0
    sweden: 0
    china: 0
    india: 0

  # Optional: only scan these specific tickers (overrides region limits)
  # allowlist: ["AAPL", "TSLA", "ABB.ST", "VOLV-B.ST"]

# Signal Detection Settings
signals:
  # Minimum score to trigger a signal (0.0–1.0)
  # Only signals above this threshold are sent
  min_score: 0.6

  # Only notify on CHANGE (not on every scan)
  # e.g., HOLD→BUY, SELL→HOLD, etc.
  require_change: true

  # Cooldown: don't send duplicate notifications for same ticker within X minutes
  cooldown_minutes: 30

# Database
database:
  path: "data/scan_pro.sqlite"

# API Settings
api:
  host: "0.0.0.0"
  port: 8080
